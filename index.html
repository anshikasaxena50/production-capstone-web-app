<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere - E-Commerce Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>ShopSphere</h1>
    <p>Your simple online shopping experience</p>

    <nav>
        <button id="loginBtn">Login</button>
        <button id="logoutBtn" hidden>Logout</button>
        <button id="cartBtn">Cart (<span id="cartCount">0</span>)</button>
    </nav>
</header>

<main>

    <section id="authSection">
        <h2>Welcome to ShopSphere</h2>
        <p id="userStatus">Please login to continue shopping.</p>

        <div id="loginForm">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter your name">

            <button id="submitLogin">Login</button>
        </div>
    </section>

    <section id="catalogSection">
        <h2>Product Catalog</h2>

        <label for="searchInput">Search products</label>
        <input
            type="search"
            id="searchInput"
            placeholder="Search products..."
        >

        <label for="categorySelect">Category</label>
        <select id="categorySelect">
            <option value="all">All Categories</option>
        </select>

        <label for="sortSelect">Sort By</label>
        <select id="sortSelect">
            <option value="default">Default</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="name">Name: A to Z</option>
        </select>

        <div id="loading">Loading products...</div>

        <div id="errorMessage" role="alert" hidden></div>

        <div id="productList"></div>
    </section>

    <section id="adminSection">
        <h2>Product Management</h2>
        <p>Add or remove products from your local store catalog.</p>

        <input type="text" id="newProductName" placeholder="Product name">
        <input type="number" id="newProductPrice" placeholder="Price">

        <button id="addProductBtn">Add Product</button>

        <div id="managementList"></div>
    </section>

    <section id="cartSection">
        <h2>Shopping Cart</h2>

        <div id="cartItems">
            <p>Your cart is empty.</p>
        </div>

        <button id="clearCartBtn">Clear Cart</button>
    </section>

</main>

<footer>
    <p>ShopSphere Production Capstone Project</p>
</footer>

<script src="script.js"></script>

</body>
</html>
